name: Update Vendor Sources

on:
  schedule:
    - cron: '42 6 * * 2'
  workflow_dispatch:

env:
  MINIMUM_PYTHON_VERSION: "3.10"

jobs:
  sync:
    name: Update Vendor Sources
    runs-on: ubuntu-latest

    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPENDENCY_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.MINIMUM_PYTHON_VERSION }}

      - name: Update Vendor Sources
        run: uv run python ./scripts/update_vendor.py

      - name: Run black
        run: uv run black .

      - name: Run pre-commit
        run: uv run pre-commit run -a
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Automated vendor update"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch-suffix: "short-commit-hash"
          delete-branch: true
          title: "Automated vendor update"
          body: ""
